<svg xmlns="http://www.w3.org/2000/svg" width="720" height="726" viewBox="0 0 720 726" role="img" aria-labelledby="title desc"><title id="title">Three Boundaries: Memory, Outbound Approval &amp; Folder Split</title><desc id="desc">Architecture diagram following the prose order: 1. Startup index (&lt;=80 lines), on-demand topic notes, and nightly review; 2. Quarantined reads and hash-locked 1-tap phone approval; 3. Private local/ folder separated from the public repo by a pre-commit privacy gate.</desc><defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#14746a"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#5b46b2"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#9c5700"/>
    </marker>
    <marker id="arr-coral" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#b84a39"/>
    </marker>
  </defs><rect width="720" height="726" fill="#fbfaf7" rx="16"/><g font-family="Noto Sans CJK SC, Noto Sans, system-ui, -apple-system, sans-serif"><text x="32" y="48" font-size="21" fill="#1e293b" font-weight="700" >Three Boundaries: Memory, Outbound Approval &amp; Folder Split</text><text x="32" y="80" font-size="16" fill="#52606d" font-weight="400" >Separating deterministic Go guardrails from model judgment across three pipelines</text><rect x="20" y="102" width="680" height="196" rx="16" fill="#ffffff" stroke="#d5dce2" stroke-width="2"/><text x="42" y="136" font-size="19" fill="#1e293b" font-weight="700" >1. Organized Memory &amp; Nightly Review Pipeline</text><text x="42" y="160" font-size="14.5" fill="#52606d" font-weight="400" >Go caps the startup index and logs tool outputs; a nightly model pass verifies before updating</text><rect x="42" y="180" width="190" height="96" rx="10" fill="#f2effb" stroke="#cbbef5" stroke-width="1.5"/><text x="137" y="212" font-size="15" fill="#5b46b2" font-weight="700" text-anchor="middle">Startup Index (≤ 80L)</text><text x="137" y="238" font-size="13.5" fill="#1e293b" font-weight="500" text-anchor="middle">Compact map loaded first</text><text x="137" y="260" font-size="12.5" fill="#5b46b2" font-weight="600" text-anchor="middle">[Go enforces line cap]</text><line x1="232" y1="228" x2="270" y2="228" stroke="#5b46b2" stroke-width="2.2" marker-end="url(#arr-purple)"/><text x="251" y="216" font-size="12.5" fill="#5b46b2" font-weight="600" text-anchor="middle">read</text><rect x="276" y="180" width="190" height="96" rx="10" fill="#eaf6f3" stroke="#b5dfd8" stroke-width="1.5"/><text x="371" y="212" font-size="14.5" fill="#14746a" font-weight="700" text-anchor="middle">Topic Notes (On Demand)</text><text x="371" y="238" font-size="13.5" fill="#1e293b" font-weight="500" text-anchor="middle">Code, research &amp; life split</text><text x="371" y="260" font-size="12.5" fill="#14746a" font-weight="600" text-anchor="middle">[Loaded only when needed]</text><line x1="502" y1="228" x2="466" y2="228" stroke="#9c5700" stroke-width="2.2" marker-end="url(#arr-amber)"/><rect x="508" y="180" width="170" height="96" rx="10" fill="#fef6e7" stroke="#f3d39c" stroke-width="1.5"/><text x="593" y="212" font-size="15" fill="#9c5700" font-weight="700" text-anchor="middle">Nightly Review</text><text x="593" y="238" font-size="13.5" fill="#1e293b" font-weight="500" text-anchor="middle">Checks raw tool outputs</text><text x="593" y="260" font-size="12.5" fill="#9c5700" font-weight="600" text-anchor="middle">[Updates verified facts]</text><rect x="20" y="316" width="680" height="196" rx="16" fill="#ffffff" stroke="#d5dce2" stroke-width="2"/><text x="42" y="350" font-size="19" fill="#1e293b" font-weight="700" >2. Quarantined Read &amp; 1-Tap Mobile Approval Gate</text><text x="42" y="374" font-size="14.5" fill="#52606d" font-weight="400" >Quarantine reading is a first filter; the real boundary is the hash-locked phone approval</text><rect x="42" y="394" width="142" height="96" rx="10" fill="#f4f6f8" stroke="#d5dce2" stroke-width="1.5"/><text x="113" y="426" font-size="15.5" fill="#1e293b" font-weight="700" text-anchor="middle">External File</text><text x="113" y="450" font-size="13.5" fill="#52606d" font-weight="500" text-anchor="middle">Read in quarantine</text><text x="113" y="472" font-size="12.5" fill="#52606d" font-weight="600" text-anchor="middle">Marked untrusted</text><line x1="184" y1="442" x2="210" y2="442" stroke="#64748b" stroke-width="2.2" marker-end="url(#arr)"/><rect x="216" y="394" width="148" height="96" rx="10" fill="#fef6e7" stroke="#f3d39c" stroke-width="1.5"/><text x="290" y="426" font-size="15.5" fill="#9c5700" font-weight="700" text-anchor="middle">Stage Proposal</text><text x="290" y="450" font-size="13.5" fill="#1e293b" font-weight="500" text-anchor="middle">Go locks exact cmd</text><text x="290" y="472" font-size="12.5" fill="#9c5700" font-weight="600" text-anchor="middle">Computes cmd hash</text><line x1="364" y1="442" x2="390" y2="442" stroke="#9c5700" stroke-width="2.2" marker-end="url(#arr-amber)"/><rect x="396" y="394" width="148" height="96" rx="10" fill="#f2effb" stroke="#cbbef5" stroke-width="1.5"/><text x="470" y="426" font-size="15.5" fill="#5b46b2" font-weight="700" text-anchor="middle">1-Tap Phone Gate</text><text x="470" y="450" font-size="13.5" fill="#1e293b" font-weight="500" text-anchor="middle">Shows summary &amp; id</text><text x="470" y="472" font-size="12.5" fill="#5b46b2" font-weight="600" text-anchor="middle">Tap Approve / Reject</text><line x1="544" y1="442" x2="570" y2="442" stroke="#14746a" stroke-width="2.2" marker-end="url(#arr-teal)"/><rect x="576" y="394" width="102" height="96" rx="10" fill="#eaf6f3" stroke="#b5dfd8" stroke-width="1.5"/><text x="627" y="426" font-size="15.5" fill="#14746a" font-weight="700" text-anchor="middle">Execute</text><text x="627" y="450" font-size="13" fill="#1e293b" font-weight="500" text-anchor="middle">Hash matches</text><text x="627" y="472" font-size="12.5" fill="#14746a" font-weight="600" text-anchor="middle">Runs command</text><rect x="20" y="530" width="680" height="176" rx="16" fill="#ffffff" stroke="#d5dce2" stroke-width="2"/><text x="42" y="564" font-size="19" fill="#1e293b" font-weight="700" >3. Two-Layer Workspace Split (Public Code vs. Private Notes)</text><rect x="42" y="584" width="216" height="100" rx="10" fill="#eaf6f3" stroke="#b5dfd8" stroke-width="1.5"/><text x="150" y="616" font-size="16" fill="#14746a" font-weight="700" text-anchor="middle">Private Folder (local/)</text><text x="150" y="642" font-size="13.5" fill="#1e293b" font-weight="500" text-anchor="middle">Notes · Finances · Worktrees</text><text x="150" y="666" font-size="12.5" fill="#14746a" font-weight="600" text-anchor="middle">Git-ignored · Private backup</text><line x1="258" y1="634" x2="286" y2="634" stroke="#b84a39" stroke-width="2.2" marker-end="url(#arr-coral)"/><rect x="292" y="584" width="156" height="100" rx="10" fill="#f9eae7" stroke="#e5b8b0" stroke-width="1.5" stroke-dasharray="5,3"/><text x="370" y="616" font-size="16" fill="#b84a39" font-weight="700" text-anchor="middle">Pre-Commit Gate</text><text x="370" y="642" font-size="13.5" fill="#b84a39" font-weight="600" text-anchor="middle">5 privacy checks</text><text x="370" y="666" font-size="12.5" fill="#1e293b" font-weight="500" text-anchor="middle">Blocks leaks &amp; keys</text><line x1="448" y1="634" x2="476" y2="634" stroke="#5b46b2" stroke-width="2.2" marker-end="url(#arr-purple)"/><rect x="482" y="584" width="196" height="100" rx="10" fill="#f2effb" stroke="#cbbef5" stroke-width="1.5"/><text x="580" y="616" font-size="16" fill="#5b46b2" font-weight="700" text-anchor="middle">Public Repo Tree</text><text x="580" y="642" font-size="13.5" fill="#1e293b" font-weight="500" text-anchor="middle">Go helper &amp; generic skills</text><text x="580" y="666" font-size="12.5" fill="#5b46b2" font-weight="600" text-anchor="middle">Safe to push &amp; share</text></g></svg>
