<svg xmlns="http://www.w3.org/2000/svg" width="760" height="572" viewBox="0 0 760 572" role="img" aria-labelledby="title desc"><title id="title">What does extra training look like?</title><desc id="desc">Simplified illustration: examples with answers, parameter updates, then separate evaluation questions. The example message is fictional.</desc><rect width="760" height="572" fill="#fbfaf7"/><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><text x="36" y="60" font-size="32" fill="#202e3b" font-weight="700" >What does extra training look like?</text><rect x="24" y="96" width="712" height="110" rx="18" fill="#fff" stroke="#dedfdd"/><circle cx="65" cy="141" r="22" fill="#6952bd"/><text x="65" y="151" font-size="27" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="104" y="150" font-size="27" fill="#202e3b" font-weight="700" >Show examples and correct answers</text><text x="48" y="189" font-size="25" fill="#56636c" font-weight="400" >“Wrong address” → change the address</text><path d="M380 209 v24 m-8 -8 l8 8 8 -8" fill="none" stroke="#56636c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="238" width="712" height="110" rx="18" fill="#fff" stroke="#dedfdd"/><circle cx="65" cy="283" r="22" fill="#6952bd"/><text x="65" y="293" font-size="27" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="104" y="292" font-size="27" fill="#202e3b" font-weight="700" >Let the model adjust its decisions</text><text x="48" y="331" font-size="25" fill="#56636c" font-weight="400" >Training changes some internal parameters.</text><path d="M380 351 v24 m-8 -8 l8 8 8 -8" fill="none" stroke="#56636c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="380" width="712" height="110" rx="18" fill="#eaf4ef" stroke="#dedfdd"/><circle cx="65" cy="425" r="22" fill="#197b70"/><text x="65" y="435" font-size="27" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="104" y="434" font-size="27" fill="#202e3b" font-weight="700" >Check a separate set of questions</text><text x="48" y="473" font-size="25" fill="#56636c" font-weight="400" >Does it still work beyond the practice examples?</text><text x="36" y="538" font-size="28" fill="#202e3b" font-weight="700" >Good practice scores ≠ good scores elsewhere</text></g></svg>
