<svg xmlns="http://www.w3.org/2000/svg" width="760" height="572" viewBox="0 0 760 572" role="img" aria-labelledby="title desc"><title id="title">给 AI 补课，大致是这三步</title><desc id="desc">简化示意：例子与答案，调整模型参数，再用未直接训练的题检查效果。例子是虚构的。</desc><rect width="760" height="572" fill="#fbfaf7"/><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><text x="36" y="60" font-size="34" fill="#202e3b" font-weight="700" >给 AI 补课，大致是这三步</text><rect x="24" y="96" width="712" height="110" rx="18" fill="#fff" stroke="#dedfdd"/><circle cx="65" cy="141" r="22" fill="#6952bd"/><text x="65" y="151" font-size="27" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="104" y="150" font-size="32" fill="#202e3b" font-weight="700" >给例子，也给正确答案</text><text x="48" y="189" font-size="28" fill="#56636c" font-weight="400" >“地址填错了” → 修改地址</text><path d="M380 209 v24 m-8 -8 l8 8 8 -8" fill="none" stroke="#56636c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="238" width="712" height="110" rx="18" fill="#fff" stroke="#dedfdd"/><circle cx="65" cy="283" r="22" fill="#6952bd"/><text x="65" y="293" font-size="27" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="104" y="292" font-size="32" fill="#202e3b" font-weight="700" >让模型调整判断方式</text><text x="48" y="331" font-size="28" fill="#56636c" font-weight="400" >根据例子，逐步调整内部参数。</text><path d="M380 351 v24 m-8 -8 l8 8 8 -8" fill="none" stroke="#56636c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="380" width="712" height="110" rx="18" fill="#eaf4ef" stroke="#dedfdd"/><circle cx="65" cy="425" r="22" fill="#197b70"/><text x="65" y="435" font-size="27" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="104" y="434" font-size="32" fill="#202e3b" font-weight="700" >拿另外的题，检查效果</text><text x="48" y="473" font-size="28" fill="#56636c" font-weight="400" >离开练过的例子，判断还对吗？</text><text x="36" y="538" font-size="30" fill="#202e3b" font-weight="700" >练习做得好 ≠ 换一批题也做得好</text></g></svg>
