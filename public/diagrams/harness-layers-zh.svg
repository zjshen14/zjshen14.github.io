<svg xmlns="http://www.w3.org/2000/svg" width="720" height="726" viewBox="0 0 720 726" role="img" aria-labelledby="title desc"><title id="title">防止多任务“串味”的三道边界：记忆、外发审批与目录分层</title><desc id="desc">架构图：按正文顺序展示三道隔离边界：1. 启动索引（≤80行）、按需专题笔记与夜间核对；2. 外部文件隔离读取与绑定命令哈希的手机端一键确认；3. 私密 local/ 目录与公开代码树经提交前隐私门禁隔离。</desc><defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#14746a"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#5b46b2"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#9c5700"/>
    </marker>
    <marker id="arr-coral" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#b84a39"/>
    </marker>
  </defs><rect width="720" height="726" fill="#fbfaf7" rx="16"/><g font-family="Noto Sans CJK SC, Noto Sans, system-ui, -apple-system, sans-serif"><text x="32" y="48" font-size="24" fill="#1e293b" font-weight="700" >防止多任务“串味”的三道边界：记忆、外发审批与目录分层</text><text x="32" y="80" font-size="17" fill="#52606d" font-weight="400" >清晰划分哪些步骤由 Go 代码确定性执行，哪些步骤交给模型判断</text><rect x="20" y="102" width="680" height="196" rx="16" fill="#ffffff" stroke="#d5dce2" stroke-width="2"/><text x="42" y="136" font-size="19" fill="#1e293b" font-weight="700" >1. 分层记忆与夜间核对流水线</text><text x="42" y="160" font-size="14.5" fill="#52606d" font-weight="400" >Go 限制启动索引长度并记录原始输出；夜间定时模型任务核实后再更新专题</text><rect x="42" y="180" width="190" height="96" rx="10" fill="#f2effb" stroke="#cbbef5" stroke-width="1.5"/><text x="137" y="212" font-size="16" fill="#5b46b2" font-weight="700" text-anchor="middle">启动索引 (≤ 80 行)</text><text x="137" y="238" font-size="13.5" fill="#1e293b" font-weight="500" text-anchor="middle">每次启动只读精简地图</text><text x="137" y="260" font-size="12.5" fill="#5b46b2" font-weight="600" text-anchor="middle">[Go 强制行数上限]</text><line x1="232" y1="228" x2="270" y2="228" stroke="#5b46b2" stroke-width="2.2" marker-end="url(#arr-purple)"/><text x="251" y="216" font-size="12.5" fill="#5b46b2" font-weight="600" text-anchor="middle">按需</text><rect x="276" y="180" width="190" height="96" rx="10" fill="#eaf6f3" stroke="#b5dfd8" stroke-width="1.5"/><text x="371" y="212" font-size="16" fill="#14746a" font-weight="700" text-anchor="middle">分领域专题笔记</text><text x="371" y="238" font-size="13.5" fill="#1e293b" font-weight="500" text-anchor="middle">代码 / 投资 / 家庭各自独立</text><text x="371" y="260" font-size="12.5" fill="#14746a" font-weight="600" text-anchor="middle">[聊到相关话题才加载]</text><line x1="502" y1="228" x2="466" y2="228" stroke="#9c5700" stroke-width="2.2" marker-end="url(#arr-amber)"/><rect x="508" y="180" width="170" height="96" rx="10" fill="#fef6e7" stroke="#f3d39c" stroke-width="1.5"/><text x="593" y="212" font-size="16" fill="#9c5700" font-weight="700" text-anchor="middle">夜间核对任务</text><text x="593" y="238" font-size="13.5" fill="#1e293b" font-weight="500" text-anchor="middle">对照当天真实工具记录</text><text x="593" y="260" font-size="12.5" fill="#9c5700" font-weight="600" text-anchor="middle">[核实后才写入专题]</text><rect x="20" y="316" width="680" height="196" rx="16" fill="#ffffff" stroke="#d5dce2" stroke-width="2"/><text x="42" y="350" font-size="19" fill="#1e293b" font-weight="700" >2. 外部读取清洗与手机端一键外发门禁</text><text x="42" y="374" font-size="14.5" fill="#52606d" font-weight="400" >隔离清洗作为第一道过滤；真正的安全边界是绑定命令哈希的手机端人工确认</text><rect x="42" y="394" width="142" height="96" rx="10" fill="#f4f6f8" stroke="#d5dce2" stroke-width="1.5"/><text x="113" y="426" font-size="15.5" fill="#1e293b" font-weight="700" text-anchor="middle">外部邮件 / 文件</text><text x="113" y="450" font-size="13.5" fill="#52606d" font-weight="500" text-anchor="middle">先经隔离读取包装</text><text x="113" y="472" font-size="12.5" fill="#52606d" font-weight="600" text-anchor="middle">标记为不可信数据</text><line x1="184" y1="442" x2="210" y2="442" stroke="#64748b" stroke-width="2.2" marker-end="url(#arr)"/><rect x="216" y="394" width="148" height="96" rx="10" fill="#fef6e7" stroke="#f3d39c" stroke-width="1.5"/><text x="290" y="426" font-size="15.5" fill="#9c5700" font-weight="700" text-anchor="middle">生成外发提案</text><text x="290" y="450" font-size="13.5" fill="#1e293b" font-weight="500" text-anchor="middle">Go 锁定完整命令</text><text x="290" y="472" font-size="12.5" fill="#9c5700" font-weight="600" text-anchor="middle">计算唯一哈希值</text><line x1="364" y1="442" x2="390" y2="442" stroke="#9c5700" stroke-width="2.2" marker-end="url(#arr-amber)"/><rect x="396" y="394" width="148" height="96" rx="10" fill="#f2effb" stroke="#cbbef5" stroke-width="1.5"/><text x="470" y="426" font-size="15.5" fill="#5b46b2" font-weight="700" text-anchor="middle">手机一键确认</text><text x="470" y="450" font-size="13.5" fill="#1e293b" font-weight="500" text-anchor="middle">弹出选择题卡片</text><text x="470" y="472" font-size="12.5" fill="#5b46b2" font-weight="600" text-anchor="middle">人工点击批准或拒绝</text><line x1="544" y1="442" x2="570" y2="442" stroke="#14746a" stroke-width="2.2" marker-end="url(#arr-teal)"/><rect x="576" y="394" width="102" height="96" rx="10" fill="#eaf6f3" stroke="#b5dfd8" stroke-width="1.5"/><text x="627" y="426" font-size="15.5" fill="#14746a" font-weight="700" text-anchor="middle">核对执行</text><text x="627" y="450" font-size="13" fill="#1e293b" font-weight="500" text-anchor="middle">校验哈希一致</text><text x="627" y="472" font-size="12.5" fill="#14746a" font-weight="600" text-anchor="middle">发消息 / 合PR</text><rect x="20" y="530" width="680" height="176" rx="16" fill="#ffffff" stroke="#d5dce2" stroke-width="2"/><text x="42" y="564" font-size="19" fill="#1e293b" font-weight="700" >3. 双层工作区物理隔离（通用代码 vs. 个人私密目录）</text><rect x="42" y="584" width="216" height="100" rx="10" fill="#eaf6f3" stroke="#b5dfd8" stroke-width="1.5"/><text x="150" y="616" font-size="16" fill="#14746a" font-weight="700" text-anchor="middle">私密目录 (local/)</text><text x="150" y="642" font-size="13.5" fill="#1e293b" font-weight="500" text-anchor="middle">个人笔记 / 财务底稿 / 任务分支</text><text x="150" y="666" font-size="12.5" fill="#14746a" font-weight="600" text-anchor="middle">被主仓库忽略 · 独立私有备份</text><line x1="258" y1="634" x2="286" y2="634" stroke="#b84a39" stroke-width="2.2" marker-end="url(#arr-coral)"/><rect x="292" y="584" width="156" height="100" rx="10" fill="#f9eae7" stroke="#e5b8b0" stroke-width="1.5" stroke-dasharray="5,3"/><text x="370" y="616" font-size="16" fill="#b84a39" font-weight="700" text-anchor="middle">提交前自动扫描</text><text x="370" y="642" font-size="13.5" fill="#b84a39" font-weight="600" text-anchor="middle">5 项隐私与路径检查</text><text x="370" y="666" font-size="12.5" fill="#1e293b" font-weight="500" text-anchor="middle">拦截私密文件与密钥</text><line x1="448" y1="634" x2="476" y2="634" stroke="#5b46b2" stroke-width="2.2" marker-end="url(#arr-purple)"/><rect x="482" y="584" width="196" height="100" rx="10" fill="#f2effb" stroke="#cbbef5" stroke-width="1.5"/><text x="580" y="616" font-size="16" fill="#5b46b2" font-weight="700" text-anchor="middle">公开代码树 (主仓库)</text><text x="580" y="642" font-size="13.5" fill="#1e293b" font-weight="500" text-anchor="middle">Go 小助手源码与通用技能</text><text x="580" y="666" font-size="12.5" fill="#5b46b2" font-weight="600" text-anchor="middle">可放心同步与开源分享</text></g></svg>
