<svg xmlns="http://www.w3.org/2000/svg" width="760" height="822" viewBox="0 0 760 822" role="img" aria-labelledby="title desc"><title id="title">“在提要求”和“要办什么”，是两道题</title><desc id="desc">虚构对话：用户先要求取消预订，随后撤回并要求修改到达时间。识别提出请求这一话语行为，不等于选对修改时间这一当前动作。</desc><rect width="760" height="822" fill="#fbfaf7"/><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><text x="36" y="60" font-size="31" fill="#202e3b" font-weight="700" >“在提要求”和“要办什么”，是两道题</text><rect x="24" y="96" width="712" height="206" rx="18" fill="#eef0f5" /><text x="48" y="140" font-size="26" fill="#56636c" font-weight="700" >同一段对话</text><text x="48" y="187" font-size="30" fill="#202e3b" font-weight="400" >之前：“请取消我的预订。”</text><text x="48" y="238" font-size="30" fill="#202e3b" font-weight="700" >现在：“还是保留吧，</text><text x="48" y="280" font-size="30" fill="#202e3b" font-weight="700" >　　　只改一下到达时间。”</text><path d="M380 318 v24 m-8 -8 l8 8 8 -8" fill="none" stroke="#56636c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="360" width="712" height="160" rx="18" fill="#fff" stroke="#dedfdd"/><text x="48" y="405" font-size="30" fill="#56636c" font-weight="700" >这句话在做什么？</text><text x="48" y="464" font-size="40" fill="#6952bd" font-weight="700" >提出请求</text><text x="48" y="501" font-size="25" fill="#56636c" font-weight="400" >识别说话的方式，还没选出具体动作。</text><rect x="24" y="548" width="712" height="192" rx="18" fill="#eaf4ef" /><text x="48" y="593" font-size="30" fill="#56636c" font-weight="700" >程序现在应该办什么？</text><text x="48" y="652" font-size="40" fill="#197b70" font-weight="700" >修改到达时间</text><text x="48" y="697" font-size="27" fill="#56636c" font-weight="400" >“取消预订”已经被撤回。</text><text x="48" y="729" font-size="25" fill="#56636c" font-weight="400" >需要读懂上下文，以及用户改了主意。</text><text x="36" y="791" font-size="24" fill="#56636c" font-weight="400" >虚构例子 · 不代表模型的实际回答</text></g></svg>
