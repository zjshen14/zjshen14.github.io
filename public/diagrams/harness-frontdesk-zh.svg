<svg xmlns="http://www.w3.org/2000/svg" width="720" height="748" viewBox="0 0 720 748" role="img" aria-labelledby="title desc"><title id="title">多任务个人 Agent 架构：主对话分流与钩子护栏</title><desc id="desc">架构图：前台主对话负责接待与派发；当主对话自己调用工具时，Go 钩子护栏放行前 3 次轻量查询，否决第 4 次查询及直接改代码跑测试；耗时任务在后台子代理、独立任务线程及各自的 git worktree 中并行推进。</desc><defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#14746a"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#5b46b2"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#9c5700"/>
    </marker>
    <marker id="arr-coral" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#b84a39"/>
    </marker>
  </defs><rect width="720" height="748" fill="#fbfaf7" rx="16"/><g font-family="Noto Sans CJK SC, Noto Sans, system-ui, -apple-system, sans-serif"><text x="32" y="48" font-size="26" fill="#1e293b" font-weight="700" >多任务个人 Agent 架构：主对话分流与钩子护栏</text><text x="32" y="80" font-size="18" fill="#52606d" font-weight="400" >主对话负责理解与派发；Go 小助手在每次工具调用前守住主对话边界</text><rect x="20" y="102" width="680" height="626" rx="16" fill="#ffffff" stroke="#d5dce2" stroke-width="2"/><text x="40" y="134" font-size="17" fill="#52606d" font-weight="700" >Google Antigravity 工作区</text><rect x="38" y="152" width="178" height="96" rx="12" fill="#f4f6f8" stroke="#d5dce2" stroke-width="1.5"/><text x="127" y="188" font-size="19" fill="#1e293b" font-weight="700" text-anchor="middle">手机远程界面</text><text x="127" y="214" font-size="15" fill="#52606d" font-weight="500" text-anchor="middle">与电脑端入口</text><text x="127" y="236" font-size="14" fill="#5b46b2" font-weight="600" text-anchor="middle">提问 / 一键确认</text><line x1="216" y1="200" x2="248" y2="200" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/><rect x="254" y="152" width="212" height="96" rx="12" fill="#f2effb" stroke="#cbbef5" stroke-width="2"/><text x="360" y="186" font-size="20" fill="#5b46b2" font-weight="700" text-anchor="middle">前台主对话</text><text x="360" y="212" font-size="14" fill="#1e293b" font-weight="500" text-anchor="middle">置顶单入口 · 理解与调度</text><text x="360" y="234" font-size="13.5" fill="#52606d" font-weight="400" text-anchor="middle">决定直接回答或派发后台</text><rect x="504" y="152" width="178" height="96" rx="12" fill="#eaf6f3" stroke="#b5dfd8" stroke-width="1.5"/><text x="593" y="186" font-size="17" fill="#14746a" font-weight="700" text-anchor="middle">置顶状态卡片</text><text x="593" y="212" font-size="14" fill="#1e293b" font-weight="500" text-anchor="middle">每轮结束自动刷新</text><text x="593" y="234" font-size="13" fill="#52606d" font-weight="400" text-anchor="middle">展示任务进度与待审批项</text><line x1="466" y1="200" x2="498" y2="200" stroke="#14746a" stroke-width="2.2" stroke-dasharray="5,4" marker-end="url(#arr-teal)"/><path d="M 310 248 L 310 296 L 190 296 L 190 326" fill="none" stroke="#b84a39" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-coral)"/><text x="226" y="286" font-size="14.5" fill="#b84a39" font-weight="700" text-anchor="middle">主对话自己调工具</text><path d="M 410 248 L 410 296 L 530 296 L 530 326" fill="none" stroke="#5b46b2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-purple)"/><text x="500" y="286" font-size="14.5" fill="#5b46b2" font-weight="700" text-anchor="middle">派发重任务</text><rect x="38" y="332" width="304" height="132" rx="14" fill="#1e293b" /><text x="190" y="366" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">Go 钩子护栏 (本地小助手)</text><text x="190" y="394" font-size="15" fill="#86efac" font-weight="600" text-anchor="middle">✓ 允许：前 3 次轻量只读查询</text><text x="190" y="420" font-size="15" fill="#fca5a5" font-weight="600" text-anchor="middle">✗ 否决：第 4 次查询、直接改代码、跑测试</text><text x="190" y="446" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="middle">（被否决时，提示主对话改走右侧后台分流）</text><line x1="342" y1="398" x2="372" y2="398" stroke="#b84a39" stroke-width="2.2" stroke-dasharray="4,3" marker-end="url(#arr-coral)"/><line x1="190" y1="464" x2="190" y2="504" stroke="#14746a" stroke-width="2.5" marker-end="url(#arr-teal)"/><rect x="38" y="510" width="304" height="196" rx="12" fill="#eaf6f3" stroke="#b5dfd8" stroke-width="1.5"/><text x="190" y="542" font-size="19" fill="#14746a" font-weight="700" text-anchor="middle">主对话秒级问答 (≤ 3 次查询)</text><text x="190" y="566" font-size="15" fill="#52606d" font-weight="500" text-anchor="middle">几秒内答复，手机端随时可插话</text><rect x="58" y="584" width="264" height="44" rx="8" fill="#ffffff" stroke="#b5dfd8"/><text x="190" y="612" font-size="15" fill="#1e293b" font-weight="500" text-anchor="middle">查日程 / 看任务状态 / 简短问答</text><rect x="58" y="640" width="264" height="44" rx="8" fill="#ffffff" stroke="#b5dfd8"/><text x="190" y="668" font-size="14.5" fill="#1e293b" font-weight="500" text-anchor="middle">外部动作提案 → 手机一键确认</text><rect x="378" y="332" width="304" height="374" rx="12" fill="#f2effb" stroke="#cbbef5" stroke-width="1.5"/><text x="530" y="366" font-size="19" fill="#5b46b2" font-weight="700" text-anchor="middle">后台并行工作池</text><text x="530" y="392" font-size="14.5" fill="#52606d" font-weight="500" text-anchor="middle">不占用主对话，干完活汇总结论</text><rect x="398" y="412" width="264" height="82" rx="10" fill="#ffffff" stroke="#cbbef5" stroke-width="1.5"/><text x="530" y="442" font-size="16.5" fill="#5b46b2" font-weight="700" text-anchor="middle">后台子代理 (单次自主任务)</text><text x="530" y="468" font-size="14.5" fill="#1e293b" font-weight="500" text-anchor="middle">修 Bug / 跑测试 / 提炼财报与论文</text><rect x="398" y="508" width="264" height="82" rx="10" fill="#ffffff" stroke="#cbbef5" stroke-width="1.5"/><text x="530" y="538" font-size="16.5" fill="#5b46b2" font-weight="700" text-anchor="middle">独立任务线程 (多轮深度协作)</text><text x="530" y="564" font-size="14.5" fill="#1e293b" font-weight="500" text-anchor="middle">架构设计 / 撰写长文 / 复杂建模</text><rect x="398" y="604" width="264" height="82" rx="10" fill="#fef6e7" stroke="#f3d39c" stroke-width="1.5"/><text x="530" y="634" font-size="15.5" fill="#9c5700" font-weight="700" text-anchor="middle">各自独立的 Git Worktree 目录</text><text x="530" y="660" font-size="14.5" fill="#1e293b" font-weight="500" text-anchor="middle">每个编码任务独立分支，互不冲突</text></g></svg>
