<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img" aria-labelledby="title desc"><title id="title">内置配额透视 (./bin/hq obs)：高频子代理 vs. 闲置主对话</title><desc id="desc">实测对比图：通过 ./bin/hq obs 解析 68 段真实会话，连续跑 130 步和 151 步的后台子代理缓存命中率达 97.4% 和 97.9%，仅消耗 396k 和 430k 未缓存输入 Token；而 207k 上下文的闲置主对话仅唤醒 2 步就消耗 414k。通过内置 160k 水位提醒压缩，单次冷唤醒从 252k 降至 27k（减少 89.2%）。</desc><defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#14746a"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#5b46b2"/>
    </marker>
  </defs><rect width="720" height="620" fill="#fbfaf7" rx="16"/><g font-family="Noto Sans CJK SC, Noto Sans, system-ui, -apple-system, sans-serif"><text x="32" y="48" font-size="23" fill="#1e293b" font-weight="700" >内置配额透视 (./bin/hq obs)：高频子代理 vs. 闲置主对话</text><text x="32" y="80" font-size="15.8" fill="#52606d" font-weight="400" >实测 68 段真实会话（5.06 亿总 Token）：连续跑代码的子代理比闲置唤醒的主对话更省配额</text><rect x="20" y="102" width="680" height="294" rx="16" fill="#ffffff" stroke="#d5dce2" stroke-width="2"/><text x="42" y="136" font-size="18.5" fill="#1e293b" font-weight="700" >实际计费的“未命中缓存”输入 Token 对比（越短越省）</text><text x="42" y="160" font-size="14" fill="#52606d" font-weight="400" >后台子代理每隔 3–8 秒连续执行，前缀缓存始终滚烫；主对话闲置超 5 分钟后缓存归零</text><text x="42" y="200" font-size="15.5" fill="#1e293b" font-weight="700" >后台子代理（连续跑 130 步）</text><text x="42" y="220" font-size="12.5" fill="#52606d" font-weight="500" >总吞吐 1524 万 · 缓存命中 97.4%</text><rect x="286" y="188" width="248" height="30" rx="6" fill="#f0eef4" /><rect x="286" y="188" width="205" height="30" rx="6" fill="#14746a" /><text x="676" y="210" font-size="16" fill="#14746a" font-weight="700" text-anchor="end">396k 未缓存</text><text x="42" y="262" font-size="15.5" fill="#b84a39" font-weight="700" >前台主对话（闲置唤醒仅 2 步）</text><text x="42" y="282" font-size="12.5" fill="#52606d" font-weight="500" >207k 上下文 · 闲置 11m/29m (命中 0%)</text><rect x="286" y="250" width="248" height="30" rx="6" fill="#f0eef4" /><rect x="286" y="250" width="214" height="30" rx="6" fill="#b84a39" /><text x="676" y="272" font-size="16" fill="#b84a39" font-weight="700" text-anchor="end">414k 未缓存</text><text x="42" y="324" font-size="15.5" fill="#1e293b" font-weight="700" >后台子代理（连续跑 151 步）</text><text x="42" y="344" font-size="12.5" fill="#52606d" font-weight="500" >总吞吐 2059 万 · 缓存命中 97.9%</text><rect x="286" y="312" width="248" height="30" rx="6" fill="#f0eef4" /><rect x="286" y="312" width="222" height="30" rx="6" fill="#5b46b2" /><text x="676" y="334" font-size="16" fill="#5b46b2" font-weight="700" text-anchor="end">430k 未缓存</text><text x="42" y="376" font-size="14" fill="#b84a39" font-weight="700" >结论：主对话闲置唤醒 2 步（414k），比连续跑 130 步的编码子代理（396k）更费配额。</text><rect x="20" y="414" width="680" height="186" rx="16" fill="#ffffff" stroke="#d5dce2" stroke-width="2"/><text x="42" y="448" font-size="18" fill="#1e293b" font-weight="700" >内置上下文水位守护：提前在 160k 提醒压缩，避开高水位冷启动</text><rect x="42" y="468" width="290" height="110" rx="10" fill="#f9eae7" stroke="#e5b8b0" stroke-width="1.5"/><text x="187" y="498" font-size="15.5" fill="#b84a39" font-weight="700" text-anchor="middle">放任不管：主对话涨到 ~255k</text><text x="187" y="524" font-size="13.5" fill="#1e293b" font-weight="500" text-anchor="middle">49 次冷启动烧掉 951 万未缓存 Token</text><text x="187" y="548" font-size="13" fill="#b84a39" font-weight="600" text-anchor="middle">单单一个主对话占去全局 23.9% 消耗</text><line x1="332" y1="523" x2="376" y2="523" stroke="#14746a" stroke-width="2.5" marker-end="url(#arr-teal)"/><rect x="382" y="468" width="296" height="110" rx="10" fill="#eaf6f3" stroke="#b5dfd8" stroke-width="1.5"/><text x="530" y="498" font-size="15.5" fill="#14746a" font-weight="700" text-anchor="middle">160k 水位线自动提醒 /compact</text><text x="530" y="524" font-size="14" fill="#1e293b" font-weight="600" text-anchor="middle">压缩后单次冷唤醒：252k → 27k</text><text x="530" y="548" font-size="13" fill="#14746a" font-weight="700" text-anchor="middle">单次唤醒立省 89.2%，长期记忆零丢失</text></g></svg>
