<svg xmlns="http://www.w3.org/2000/svg" width="760" height="822" viewBox="0 0 760 822" role="img" aria-labelledby="title desc"><title id="title">Two questions hidden inside “intent”</title><desc id="desc">Fictional conversation: a cancellation request is withdrawn and replaced with a request to change arrival time. Recognizing a request differs from choosing the current concrete action.</desc><rect width="760" height="822" fill="#fbfaf7"/><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><text x="36" y="60" font-size="32" fill="#202e3b" font-weight="700" >Two questions hidden inside “intent”</text><rect x="24" y="96" width="712" height="206" rx="18" fill="#eef0f5" /><text x="48" y="140" font-size="26" fill="#56636c" font-weight="700" >The same conversation</text><text x="48" y="187" font-size="28" fill="#202e3b" font-weight="400" >Earlier: “Please cancel my reservation.”</text><text x="48" y="238" font-size="28" fill="#202e3b" font-weight="700" >Now: “Actually, keep it.</text><text x="48" y="280" font-size="28" fill="#202e3b" font-weight="700" >Just change my arrival time.”</text><path d="M380 318 v24 m-8 -8 l8 8 8 -8" fill="none" stroke="#56636c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="360" width="712" height="160" rx="18" fill="#fff" stroke="#dedfdd"/><text x="48" y="405" font-size="30" fill="#56636c" font-weight="700" >What kind of utterance is this?</text><text x="48" y="464" font-size="40" fill="#6952bd" font-weight="700" >Making a request</text><text x="48" y="501" font-size="24" fill="#56636c" font-weight="400" >Describes the speech act, not the specific action.</text><rect x="24" y="548" width="712" height="192" rx="18" fill="#eaf4ef" /><text x="48" y="593" font-size="30" fill="#56636c" font-weight="700" >What should the program do now?</text><text x="48" y="652" font-size="40" fill="#197b70" font-weight="700" >Change the arrival time</text><text x="48" y="697" font-size="26" fill="#56636c" font-weight="400" >The cancellation request was withdrawn.</text><text x="48" y="729" font-size="24" fill="#56636c" font-weight="400" >Requires context and the change of mind.</text><text x="36" y="791" font-size="24" fill="#56636c" font-weight="400" >Illustration only · not an actual model response</text></g></svg>
