<svg xmlns="http://www.w3.org/2000/svg" width="720" height="576" viewBox="0 0 720 576" role="img" aria-labelledby="title desc"><title id="title">Who Checks the Guardrails When the Agent Edits Its Own Files?</title><desc id="desc">Architecture diagram: Compiling the Go helper once cut 18 sandbox workflow tests from 10.5s to 1.8s (82.9% less time, ~5.8x faster), enabling every push to run 5 privacy checks, 18 hook boundary probes, and 18 sandbox workflows in ~2.5s.</desc><defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#14746a"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#5b46b2"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#9c5700"/>
    </marker>
    <marker id="arr-coral" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#b84a39"/>
    </marker>
  </defs><rect width="720" height="576" fill="#fbfaf7" rx="16"/><g font-family="Noto Sans CJK SC, Noto Sans, system-ui, -apple-system, sans-serif"><text x="32" y="48" font-size="20" fill="#1e293b" font-weight="700" >Who Checks the Guardrails When the Agent Edits Its Own Files?</text><text x="32" y="80" font-size="15.5" fill="#52606d" font-weight="400" >Compiling the Go helper once cut sandbox test time from 10.5s to 1.8s (~5.8× faster)</text><rect x="20" y="102" width="680" height="250" rx="16" fill="#ffffff" stroke="#d5dce2" stroke-width="2"/><text x="42" y="138" font-size="19" fill="#1e293b" font-weight="700" >18 End-to-End Sandbox Workflow Tests</text><text x="42" y="164" font-size="15.5" fill="#52606d" font-weight="400" >Compile the Go helper once per run instead of rebuilding inside each test</text><text x="42" y="217" font-size="17" fill="#1e293b" font-weight="600" >Rebuild per test</text><rect x="248" y="194" width="280" height="32" rx="6" fill="#f0eef4" /><rect x="248" y="194" width="245" height="32" rx="6" fill="#94a3b8" /><text x="678" y="217" font-size="20" fill="#1e293b" font-weight="700" text-anchor="end">10.5s</text><text x="42" y="281" font-size="17" fill="#1e293b" font-weight="600" >Compile once &amp; share</text><rect x="248" y="258" width="280" height="32" rx="6" fill="#f0eef4" /><rect x="248" y="258" width="42" height="32" rx="6" fill="#5b46b2" /><text x="678" y="281" font-size="20" fill="#5b46b2" font-weight="700" text-anchor="end">1.8s (~5.8×)</text><text x="42" y="328" font-size="16.5" fill="#14746a" font-weight="700" >82.9% less time—fast enough to run automatically before every git push</text><rect x="20" y="372" width="680" height="184" rx="16" fill="#ffffff" stroke="#d5dce2" stroke-width="2"/><text x="42" y="408" font-size="19" fill="#1e293b" font-weight="700" >Automated Gate Before Every Push (~2.5s total)</text><rect x="42" y="432" width="188" height="98" rx="10" fill="#eaf6f3" stroke="#b5dfd8" stroke-width="1.5"/><text x="136" y="464" font-size="15.5" fill="#14746a" font-weight="700" text-anchor="middle">1. Privacy Checks</text><text x="136" y="492" font-size="15" fill="#1e293b" font-weight="600" text-anchor="middle">5 boundary rules</text><text x="136" y="514" font-size="12.5" fill="#52606d" font-weight="500" text-anchor="middle">No local notes or keys</text><line x1="230" y1="481" x2="258" y2="481" stroke="#14746a" stroke-width="2.2" marker-end="url(#arr-teal)"/><rect x="264" y="432" width="192" height="98" rx="10" fill="#f2effb" stroke="#cbbef5" stroke-width="1.5"/><text x="360" y="464" font-size="15.5" fill="#5b46b2" font-weight="700" text-anchor="middle">2. Hook Boundary Tests</text><text x="360" y="492" font-size="15" fill="#1e293b" font-weight="600" text-anchor="middle">18 simulated probes</text><text x="360" y="514" font-size="12.5" fill="#52606d" font-weight="500" text-anchor="middle">Checks lookup &amp; action gates</text><line x1="456" y1="481" x2="484" y2="481" stroke="#5b46b2" stroke-width="2.2" marker-end="url(#arr-purple)"/><rect x="490" y="432" width="188" height="98" rx="10" fill="#fef6e7" stroke="#f3d39c" stroke-width="1.5"/><text x="584" y="464" font-size="15.5" fill="#9c5700" font-weight="700" text-anchor="middle">3. Sandbox Workflows</text><text x="584" y="492" font-size="15" fill="#1e293b" font-weight="600" text-anchor="middle">18 isolated runs (1.8s)</text><text x="584" y="514" font-size="12.5" fill="#52606d" font-weight="500" text-anchor="middle">All pass → push allowed</text></g></svg>
