<svg xmlns="http://www.w3.org/2000/svg" width="760" height="854" viewBox="0 0 760 854" role="img" aria-labelledby="title desc"><title id="title">One training run. Two different results.</title><desc id="desc">One run: SGD ten-class macro accuracy 64.1% to 96.1%; JevBench stays at 177/231 correct. Different tasks and units; not a general intelligence score.</desc><rect width="760" height="854" fill="#fbfaf7"/><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><text x="36" y="58" font-size="32" fill="#202e3b" font-weight="700" >One training run. Two different results.</text><text x="36" y="100" font-size="25" fill="#56636c" font-weight="400" >Compare before and after within each task.</text><rect x="24" y="128" width="712" height="304" rx="18" fill="#fff" stroke="#e0e1df"/><text x="48" y="173" font-size="32" fill="#202e3b" font-weight="700" >Classifying dialogue acts</text><text x="48" y="211" font-size="25" fill="#56636c" font-weight="400" >For example: asking, confirming, rejecting</text><text x="48" y="281" font-size="27" fill="#202e3b" font-weight="400" >Before</text><rect x="170" y="260" width="392" height="30" rx="4" fill="#f0eef4" /><rect x="170" y="260" width="251.27199999999996" height="30" rx="4" fill="#a9a9b5" /><text x="700" y="285" font-size="32" fill="#202e3b" font-weight="700" text-anchor="end">64.1%</text><text x="48" y="354" font-size="27" fill="#202e3b" font-weight="400" >After</text><rect x="170" y="333" width="392" height="30" rx="4" fill="#f0eef4" /><rect x="170" y="333" width="376.7525517241379" height="30" rx="4" fill="#6952bd" /><text x="700" y="358" font-size="32" fill="#6952bd" font-weight="700" text-anchor="end">96.1%</text><text x="170" y="395" font-size="22" fill="#56636c" font-weight="400" >0%</text><text x="562" y="395" font-size="22" fill="#56636c" font-weight="400" text-anchor="end">100%</text><text x="48" y="421" font-size="21" fill="#56636c" font-weight="400" >Ten equally weighted classes · SGD development</text><rect x="24" y="460" width="712" height="304" rx="18" fill="#fff" stroke="#e0e1df"/><text x="48" y="505" font-size="32" fill="#202e3b" font-weight="700" >A separate public question set</text><text x="48" y="543" font-size="25" fill="#56636c" font-weight="400" >Checking decisions across different tasks</text><text x="48" y="613" font-size="27" fill="#202e3b" font-weight="400" >Before</text><rect x="170" y="592" width="392" height="30" rx="4" fill="#f0eef4" /><rect x="170" y="592" width="300.3636363636364" height="30" rx="4" fill="#a9a9b5" /><text x="700" y="617" font-size="32" fill="#202e3b" font-weight="700" text-anchor="end">177</text><text x="48" y="686" font-size="27" fill="#202e3b" font-weight="400" >After</text><rect x="170" y="665" width="392" height="30" rx="4" fill="#f0eef4" /><rect x="170" y="665" width="300.3636363636364" height="30" rx="4" fill="#6952bd" /><text x="700" y="690" font-size="32" fill="#6952bd" font-weight="700" text-anchor="end">177</text><text x="170" y="727" font-size="22" fill="#56636c" font-weight="400" >0</text><text x="562" y="727" font-size="22" fill="#56636c" font-weight="400" text-anchor="end">231 questions</text><text x="48" y="753" font-size="21" fill="#56636c" font-weight="400" >Correct answers · exposed public JevBench</text><text x="36" y="815" font-size="27" fill="#202e3b" font-weight="700" >One skill improved. Transfer needs its own check.</text></g></svg>
