<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img" aria-labelledby="title desc"><title id="title">Built-In Token Telemetry (./bin/hq obs): Subagents vs. Idle Chat</title><desc id="desc">Empirical chart from ./bin/hq obs across 68 conversations: 130-step and 151-step continuous coding subagents hit 97.4% and 97.9% prefix cache (burning only 396k and 430k uncached input tokens), while 2 idle Front Desk wakeup steps at 207k context burned 414k. The 160k compaction watermark drops cold wakeups from 252k to 27k (-89.2%).</desc><defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#14746a"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#5b46b2"/>
    </marker>
  </defs><rect width="720" height="620" fill="#fbfaf7" rx="16"/><g font-family="Noto Sans CJK SC, Noto Sans, system-ui, -apple-system, sans-serif"><text x="32" y="48" font-size="20.5" fill="#1e293b" font-weight="700" >Built-In Token Telemetry (./bin/hq obs): Subagents vs. Idle Chat</text><text x="32" y="80" font-size="15" fill="#52606d" font-weight="400" >Across 68 conversations (505.8M gross tokens), &gt;5-minute idle cache expiry dominated cost</text><rect x="20" y="102" width="680" height="294" rx="16" fill="#ffffff" stroke="#d5dce2" stroke-width="2"/><text x="42" y="136" font-size="18.5" fill="#1e293b" font-weight="700" >Uncached Input Tokens Billed (Fresh Prompt Cost)</text><text x="42" y="160" font-size="14" fill="#52606d" font-weight="400" >Subagents step every 3–8s (warm prefix cache); idle chat wakes up after cache expires (0% hit)</text><text x="42" y="200" font-size="15.5" fill="#1e293b" font-weight="700" >Coding subagent (130 steps)</text><text x="42" y="220" font-size="12.5" fill="#52606d" font-weight="500" >15.2M gross · 97.4% cache hit</text><rect x="286" y="188" width="248" height="30" rx="6" fill="#f0eef4" /><rect x="286" y="188" width="205" height="30" rx="6" fill="#14746a" /><text x="676" y="210" font-size="16" fill="#14746a" font-weight="700" text-anchor="end">396k uncached</text><text x="42" y="262" font-size="15.5" fill="#b84a39" font-weight="700" >Idle Front Desk (just 2 steps!)</text><text x="42" y="282" font-size="12.5" fill="#52606d" font-weight="500" >207k context · 11m &amp; 29m idle (0% hit)</text><rect x="286" y="250" width="248" height="30" rx="6" fill="#f0eef4" /><rect x="286" y="250" width="214" height="30" rx="6" fill="#b84a39" /><text x="676" y="272" font-size="16" fill="#b84a39" font-weight="700" text-anchor="end">414k uncached</text><text x="42" y="324" font-size="15.5" fill="#1e293b" font-weight="700" >Coding subagent (151 steps)</text><text x="42" y="344" font-size="12.5" fill="#52606d" font-weight="500" >20.6M gross · 97.9% cache hit</text><rect x="286" y="312" width="248" height="30" rx="6" fill="#f0eef4" /><rect x="286" y="312" width="222" height="30" rx="6" fill="#5b46b2" /><text x="676" y="334" font-size="16" fill="#5b46b2" font-weight="700" text-anchor="end">430k uncached</text><text x="42" y="376" font-size="14" fill="#b84a39" font-weight="700" >2 idle chat wakeups (414k) billed more fresh input than a 130-step subagent (396k).</text><rect x="20" y="414" width="680" height="186" rx="16" fill="#ffffff" stroke="#d5dce2" stroke-width="2"/><text x="42" y="448" font-size="17" fill="#1e293b" font-weight="700" >Built-In 160k Context Watermark Instead of Drifting to ~255k</text><rect x="42" y="468" width="290" height="110" rx="10" fill="#f9eae7" stroke="#e5b8b0" stroke-width="1.5"/><text x="187" y="498" font-size="15.5" fill="#b84a39" font-weight="700" text-anchor="middle">Unchecked: Drift to ~255k</text><text x="187" y="524" font-size="13.5" fill="#1e293b" font-weight="500" text-anchor="middle">49 cold wakeups burned 9.51M fresh</text><text x="187" y="548" font-size="13" fill="#b84a39" font-weight="600" text-anchor="middle">(23.9% of entire workspace spend!)</text><line x1="332" y1="523" x2="376" y2="523" stroke="#14746a" stroke-width="2.5" marker-end="url(#arr-teal)"/><rect x="382" y="468" width="296" height="110" rx="10" fill="#eaf6f3" stroke="#b5dfd8" stroke-width="1.5"/><text x="530" y="498" font-size="15.5" fill="#14746a" font-weight="700" text-anchor="middle">Nudge /compact at 160k</text><text x="530" y="524" font-size="14" fill="#1e293b" font-weight="600" text-anchor="middle">Cold wakeup drops: 252k → 27k</text><text x="530" y="548" font-size="13" fill="#14746a" font-weight="700" text-anchor="middle">89.2% less per wakeup; vault intact</text></g></svg>
