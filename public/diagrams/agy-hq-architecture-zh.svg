="44" y="374" width="150" height="46" rx="7" fill="#ffffff" stroke="#d5dce2"/><text x="52" y="394" font-size="12" fill="#1e293b" font-weight="600" >[Auto] 07:30 早间简报</text><text x="52" y="411" font-size="11" fill="#52606d" font-weight="400" >定时触发守护</text><rect x="216" y="146" width="262" height="294" rx="10" fill="#ffffff" stroke="#cbbef5" stroke-width="1.8"/><text x="230" y="170" font-size="13.5" fill="#5b46b2" font-weight="700" >[HQ] Front Desk 对话流</text><rect x="230" y="182" width="234" height="54" rx="8" fill="#f4f6f8" stroke="#d5dce2"/><text x="240" y="202" font-size="12" fill="#1e293b" font-weight="600" >你：“下午两点有空吗？顺便对比收件</text><text x="240" y="222" font-size="12" fill="#1e293b" font-weight="600" >箱里的 ACME 季报并修下 PR #279。”</text><rect x="230" y="246" width="234" height="64" rx="8" fill="#eaf6f3" stroke="#b5dfd8"/><text x="240" y="266" font-size="12" fill="#14746a" font-weight="700" >前台 (2秒回)：“两点空闲（查1/3）。</text><text x="240" y="285" font-size="11.8" fill="#1e293b" font-weight="500" >季报对比与 PR #279 已分流至后台</text><text x="240" y="302" font-size="11.8" fill="#1e293b" font-weight="500" >独立目录，我随时待命。”</text><rect x="230" y="322" width="234" height="106" rx="8" fill="#fef6e7" stroke="#f3d39c" stroke-width="1.6"/><text x="240" y="342" font-size="12" fill="#9c5700" font-weight="700" >原生一键审批卡 (展示完整命令)</text><text x="240" y="362" font-size="11.5" fill="#1e293b" font-weight="600" >发布 ACME 摘要？sha256:e9519584</text><text x="240" y="380" font-size="11" fill="#52606d" font-weight="500" >&quot;Gross margin 64.2% (+140 bps)...&quot;</text><rect x="240" y="392" width="98" height="26" rx="6" fill="#14746a" /><text x="289" y="410" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">✓ 批准执行</text><rect x="348" y="392" width="98" height="26" rx="6" fill="#ffffff" stroke="#e5b8b0" stroke-width="1.5"/><text x="397" y="410" font-size="12" fill="#b84a39" font-weight="700" text-anchor="middle">✕ 拒绝</text><rect x="490" y="146" width="196" height="294" rx="10" fill="#eaf6f3" stroke="#b5dfd8" stroke-width="1.6"/><text x="502" y="170" font-size="13" fill="#14746a" font-weight="700" >置顶看板 hq_console.md</text><text x="502" y="188" font-size="11.2" fill="#52606d" font-weight="600" >Go 自动刷新 · 0 模型 Token</text><rect x="500" y="200" width="176" height="38" rx="6" fill="#ffffff" stroke="#b5dfd8"/><text x="508" y="216" font-size="11" fill="#52606d" font-weight="600" >活跃任务</text><text x="508" y="231" font-size="12" fill="#1e293b" font-weight="700" >2 个后台运行中</text><rect x="500" y="246" width="176" height="38" rx="6" fill="#ffffff" stroke="#b5dfd8"/><text x="508" y="262" font-size="11" fill="#52606d" font-weight="600" >独立分支</text><text x="508" y="277" font-size="12" fill="#5b46b2" font-weight="700" >web-fix-pr279</text><rect x="500" y="292" width="176" height="38" rx="6" fill="#ffffff" stroke="#b5dfd8"/><text x="508" y="308" font-size="11" fill="#52606d" font-weight="600" >待批提案</text><text x="508" y="323" font-size="12" fill="#9c5700" font-weight="700" >1 项 (e9519584)</text><rect x="500" y="338" width="176" height="38" rx="6" fill="#ffffff" stroke="#b5dfd8"/><text x="508" y="354" font-size="11" fill="#52606d" font-weight="600" >记忆索引</text><text x="508" y="369" font-size="12" fill="#14746a" font-weight="700" >13 / 80 行 (健康)</text><rect x="500" y="384" width="176" height="38" rx="6" fill="#ffffff" stroke="#b5dfd8"/><text x="508" y="400" font-size="11" fill="#52606d" font-weight="600" >主台水位</text><text x="508" y="415" font-size="12" fill="#14746a" font-weight="700" >42k / 160k Token</text><line x1="230" y1="454" x2="230" y2="482" stroke="#64748b" stroke-width="2.4" marker-end="url(#arr)"/><line x1="520" y1="454" x2="520" y2="482" stroke="#14746a" stroke-width="2.4" marker-end="url(#arr-teal)"/><rect x="20" y="488" width="332" height="188" rx="14" fill="#1e293b" /><text x="36" y="520" font-size="16.5" fill="#ffffff" font-weight="700" >本地零依赖 Go 引擎 (./bin/hq)</text><text x="36" y="548" font-size="12.8" fill="#cbd5e1" font-weight="500" >• 按需派单：轻量秒回，重活按难度选模型</text><text x="36" y="574" font-size="12.8" fill="#86efac" font-weight="600" >• PreToolUse：主台限 3 次查询，禁直接改码</text><text x="36" y="600" font-size="12.8" fill="#fcd34d" font-weight="600" >• 污点与哈希锁：隔离外部附件，校验 ≥8位哈希</text><text x="36" y="626" font-size="12.8" fill="#cbd5e1" font-weight="500" >• Stop &amp; obs：零开销刷看板、统计缓存命中率</text><text x="36" y="654" font-size="12" fill="#94a3b8" font-weight="400" >（纯 Go 标准库零依赖，启动记忆 ≤80 行）</text><rect x="368" y="488" width="332" height="188" rx="14" fill="#ffffff" stroke="#d5dce2" stroke-width="2"/><text x="388" y="520" font-size="16" fill="#1e293b" font-weight="700" >双层本地目录结构（代码与私密分离）</text><rect x="384" y="534" width="300" height="56" rx="9" fill="#f2effb" stroke="#cbbef5"/><text x="396" y="556" font-size="13" fill="#5b46b2" font-weight="700" >agy-hq/（通用主仓库 · 可安全分享）</text><text x="396" y="577" font-size="11.5" fill="#1e293b" font-weight="500" >cmd/hq · .agents/hooks.json · skills/*/SKILL.md</text><rect x="384" y="602" width="300" height="60" rx="9" fill="#fef6e7" stroke="#f3d39c"/><text x="396" y="624" font-size="13" fill="#9c5700" font-weight="700" >local/（Git 忽略私密库 · 独立私有备份）</text><text x="396" y="646" font-size="11.5" fill="#1e293b" font-weight="500" >inbox/ · notes/ · private/ · worktrees/&lt;task&gt;/</text></g></svg>
