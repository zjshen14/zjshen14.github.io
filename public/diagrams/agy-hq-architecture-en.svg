<svg xmlns="http://www.w3.org/2000/svg" width="720" height="696" viewBox="0 0 720 696" role="img" aria-labelledby="title desc"><title id="title">Inside agy-hq: What You See on Screen vs. What Runs on Disk</title><desc id="desc">UI and disk anatomy of agy-hq: Top shows the 3-pane Google Antigravity layout (Sidebar with pinned Front Desk and task threads, center chat with a 2-second reply and 1-tap SHA-256 approval card, right pinned hq_console.md card). Bottom shows the local zero-dependency Go helper and the two-layer split between tracked code and the git-ignored local/ vault.</desc><defs>
