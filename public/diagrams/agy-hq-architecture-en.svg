troke-width="2.4" marker-end="url(#arr-teal)"/><rect x="20" y="488" width="332" height="188" rx="14" fill="#1e293b" /><text x="36" y="520" font-size="15" fill="#ffffff" font-weight="700" >Zero-Dependency Go Helper (./bin/hq)</text><text x="36" y="548" font-size="12.8" fill="#cbd5e1" font-weight="500" >• Smart routing: fast Desk + tiered workers</text><text x="36" y="574" font-size="12.8" fill="#86efac" font-weight="600" >• PreToolUse: caps Desk at 3 reads; no edits</text><text x="36" y="600" font-size="12.8" fill="#fcd34d" font-weight="600" >• Safety: taints untrusted reads; checks hash</text><text x="36" y="626" font-size="12.8" fill="#cbd5e1" font-weight="500" >• Stop &amp; obs: 0-token board sync &amp; cache stats</text><text x="36" y="654" font-size="12" fill="#94a3b8" font-weight="400" >(Pure Go stdlib, &lt;=80-line startup memory)</text><rect x="368" y="488" width="332" height="188" rx="14" fill="#ffffff" stroke="#d5dce2" stroke-width="2"/><text x="388" y="520" font-size="16" fill="#1e293b" font-weight="700" >Two-Layer Disk Layout (Code vs. Vault)</text><rect x="384" y="534" width="300" height="56" rx="9" fill="#f2effb" stroke="#cbbef5"/><text x="396" y="556" font-size="13" fill="#5b46b2" font-weight="700" >agy-hq/ (Tracked Engine &amp; 9 Skills)</text><text x="396" y="577" font-size="11.5" fill="#1e293b" font-weight="500" >cmd/hq · hooks.json · skills/*/SKILL.md</text><rect x="384" y="602" width="300" height="60" rx="9" fill="#fef6e7" stroke="#f3d39c"/><text x="396" y="624" font-size="13" fill="#9c5700" font-weight="700" >local/ (Git-Ignored Private Vault)</text><text x="396" y="646" font-size="11.5" fill="#1e293b" font-weight="500" >inbox/ · notes/ · private/ · worktrees/&lt;task&gt;/</text></g></svg>
