<svg xmlns="http://www.w3.org/2000/svg" width="720" height="676" viewBox="0 0 720 676" role="img" aria-labelledby="title desc"><title id="title">9 Modular Built-In Skills (Pure Markdown, Keep What You Use)</title><desc id="desc">3x3 modular grid of the 9 independent built-in SKILL.md plugins (swe-pulse, morning-brief, sleep-consolidate, inbox-triage, gchat, filing-diff, thesis-check, ledger-ingest, tax-prep), showing each skill can be used or removed independently over a shared Go safety floor.</desc><defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#14746a"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#5b46b2"/>
    </marker>
  </defs><rect width="720" height="676" fill="#fbfaf7" rx="16"/><g font-family="Noto Sans CJK SC, Noto Sans, system-ui, -apple-system, sans-serif"><text x="32" y="46" font-size="20.5" fill="#1e293b" font-weight="700" >9 Modular Built-In Skills (Pure Markdown, Keep What You Use)</text><text x="32" y="76" font-size="13.8" fill="#52606d" font-weight="400" >Independent &lt;=150-line SKILL.md files · Zero Go edits needed; ignore or delete unused skills</text><rect x="20" y="98" width="216" height="152" rx="12" fill="#ffffff" stroke="#cbbef5" stroke-width="1.8"/><rect x="32" y="110" width="192" height="26" rx="6" fill="#f2effb" /><text x="38" y="128" font-size="13" fill="#5b46b2" font-weight="700" >swe-pulse</text><text x="218" y="127" font-size="11" fill="#52606d" font-weight="600" text-anchor="end">Core</text><text x="36" y="162" font-size="15" fill="#1e293b" font-weight="700" >Multi-Repo Orchestrator</text><text x="36" y="194" font-size="12.8" fill="#52606d" font-weight="500" >Spawns isolated git worktrees;</text><text x="36" y="216" font-size="12.8" fill="#52606d" font-weight="500" >tracks PR/CI &amp; stages merges</text><rect x="252" y="98" width="216" height="152" rx="12" fill="#ffffff" stroke="#cbbef5" stroke-width="1.8"/><rect x="264" y="110" width="192" height="26" rx="6" fill="#f2effb" /><text x="270" y="128" font-size="13" fill="#5b46b2" font-weight="700" >morning-brief</text><text x="450" y="127" font-size="11" fill="#52606d" font-weight="600" text-anchor="end">Core</text><text x="268" y="162" font-size="15" fill="#1e293b" font-weight="700" >Daily 7:30 AM Digest</text><text x="268" y="194" font-size="12.8" fill="#52606d" font-weight="500" >Rolls up calendar, inbox, open</text><text x="268" y="216" font-size="12.8" fill="#52606d" font-weight="500" >PRs &amp; pending 1-tap approvals</text><rect x="484" y="98" width="216" height="152" rx="12" fill="#ffffff" stroke="#cbbef5" stroke-width="1.8"/><rect x="496" y="110" width="192" height="26" rx="6" fill="#f2effb" /><text x="502" y="128" font-size="13" fill="#5b46b2" font-weight="700" >sleep-consolidate</text><text x="682" y="127" font-size="11" fill="#52606d" font-weight="600" text-anchor="end">Core</text><text x="500" y="162" font-size="15" fill="#1e293b" font-weight="700" >Nightly Memory Audit</text><text x="500" y="194" font-size="12.8" fill="#52606d" font-weight="500" >Checks claims vs. raw tool logs;</text><text x="500" y="216" font-size="12.8" fill="#52606d" font-weight="500" >keeps MEMORY.md &lt;= 80 lines</text><rect x="20" y="266" width="216" height="152" rx="12" fill="#ffffff" stroke="#b5dfd8" stroke-width="1.8"/><rect x="32" y="278" width="192" height="26" rx="6" fill="#eaf6f3" /><text x="38" y="296" font-size="13" fill="#14746a" font-weight="700" >inbox-triage</text><text x="218" y="295" font-size="11" fill="#52606d" font-weight="600" text-anchor="end">Intake</text><text x="36" y="330" font-size="15" fill="#1e293b" font-weight="700" >Quarantined File Triage</text><text x="36" y="362" font-size="12.8" fill="#52606d" font-weight="500" >Reads local/inbox/ in tainted</text><text x="36" y="384" font-size="12.8" fill="#52606d" font-weight="500" >mode; extracts safe summaries</text><rect x="252" y="266" width="216" height="152" rx="12" fill="#ffffff" stroke="#b5dfd8" stroke-width="1.8"/><rect x="264" y="278" width="192" height="26" rx="6" fill="#eaf6f3" /><text x="270" y="296" font-size="13" fill="#14746a" font-weight="700" >gchat</text><text x="450" y="295" font-size="11" fill="#52606d" font-weight="600" text-anchor="end">Optional</text><text x="268" y="330" font-size="15" fill="#1e293b" font-weight="700" >Google Chat Workflow</text><text x="268" y="362" font-size="12.8" fill="#52606d" font-weight="500" >Reads spaces/DMs &amp; stages</text><text x="268" y="384" font-size="12.8" fill="#52606d" font-weight="500" >1-tap SHA-256 send proposals</text><rect x="484" y="266" width="216" height="152" rx="12" fill="#ffffff" stroke="#f3d39c" stroke-width="1.8"/><rect x="496" y="278" width="192" height="26" rx="6" fill="#fef6e7" /><text x="502" y="296" font-size="13" fill="#9c5700" font-weight="700" >filing-diff</text><text x="682" y="295" font-size="11" fill="#52606d" font-weight="600" text-anchor="end">Optional</text><text x="500" y="330" font-size="15" fill="#1e293b" font-weight="700" >SEC 10-K / 10-Q Diff</text><text x="500" y="362" font-size="12.8" fill="#52606d" font-weight="500" >Section-by-section diff spotting</text><text x="500" y="384" font-size="12.8" fill="#52606d" font-weight="500" >new risks &amp; footnote shifts</text><rect x="20" y="434" width="216" height="152" rx="12" fill="#ffffff" stroke="#f3d39c" stroke-width="1.8"/><rect x="32" y="446" width="192" height="26" rx="6" fill="#fef6e7" /><text x="38" y="464" font-size="13" fill="#9c5700" font-weight="700" >thesis-check</text><text x="218" y="463" font-size="11" fill="#52606d" font-weight="600" text-anchor="end">Optional</text><text x="36" y="498" font-size="15" fill="#1e293b" font-weight="700" >Thesis &amp; Kill Criteria</text><text x="36" y="530" font-size="12.8" fill="#52606d" font-weight="500" >Tests new earnings releases</text><text x="36" y="552" font-size="12.8" fill="#52606d" font-weight="500" >against written exit triggers</text><rect x="252" y="434" width="216" height="152" rx="12" fill="#ffffff" stroke="#f3d39c" stroke-width="1.8"/><rect x="264" y="446" width="192" height="26" rx="6" fill="#fef6e7" /><text x="270" y="464" font-size="13" fill="#9c5700" font-weight="700" >ledger-ingest</text><text x="450" y="463" font-size="11" fill="#52606d" font-weight="600" text-anchor="end">Optional</text><text x="268" y="498" font-size="15" fill="#1e293b" font-weight="700" >Plain-Text Accounting</text><text x="268" y="530" font-size="12.8" fill="#52606d" font-weight="500" >Parses CSV/OFX into Beancount</text><text x="268" y="552" font-size="12.8" fill="#52606d" font-weight="500" >or hledger inside local/private/</text><rect x="484" y="434" width="216" height="152" rx="12" fill="#ffffff" stroke="#f3d39c" stroke-width="1.8"/><rect x="496" y="446" width="192" height="26" rx="6" fill="#fef6e7" /><text x="502" y="464" font-size="13" fill="#9c5700" font-weight="700" >tax-prep</text><text x="682" y="463" font-size="11" fill="#52606d" font-weight="600" text-anchor="end">Optional</text><text x="500" y="498" font-size="15" fill="#1e293b" font-weight="700" >Local Tax Workpapers</text><text x="500" y="530" font-size="12.8" fill="#52606d" font-weight="500" >Extracts W-2/1099 fields &amp;</text><text x="500" y="552" font-size="12.8" fill="#52606d" font-weight="500" >checklists in local/private/</text><rect x="20" y="600" width="680" height="56" rx="12" fill="#1e293b" /><text x="360" y="624" font-size="13" fill="#cbd5e1" font-weight="500" text-anchor="middle">Every skill inherits the same deterministic Go safety &amp; verification floor:</text><text x="360" y="644" font-size="12.3" fill="#86efac" font-weight="700" text-anchor="middle">Tainted-session quarantine · &gt;=8-char SHA-256 approvals · 6 privacy checks · 21 sandbox E2E tests (~1.8s)</text></g></svg>
