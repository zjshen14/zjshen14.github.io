<svg xmlns="http://www.w3.org/2000/svg" width="720" height="676" viewBox="0 0 720 676" role="img" aria-labelledby="title desc"><title id="title">9 项模块化内置技能（纯 Markdown 插件，互不耦合）</title><desc id="desc">模块化技能矩阵图：3x3 网格展示 9 个互不耦合的内置 SKILL.md 插件（swe-pulse、morning-brief、sleep-consolidate、inbox-triage、gchat、filing-diff、thesis-check、ledger-ingest、tax-prep），无需串联执行，可按需保留或删除，底层统一继承 Go 安全与测试护栏。</desc><defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#14746a"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#5b46b2"/>
    </marker>
  </defs><rect width="720" height="676" fill="#fbfaf7" rx="16"/><g font-family="Noto Sans CJK SC, Noto Sans, system-ui, -apple-system, sans-serif"><text x="32" y="46" font-size="23" fill="#1e293b" font-weight="700" >9 项模块化内置技能（纯 Markdown 插件，互不耦合）</text><text x="32" y="76" font-size="13.8" fill="#52606d" font-weight="400" >每项技能只是独立的 SKILL.md（≤150 行），无需改 Go 代码，用不上的领域可直接忽略或删除</text><rect x="20" y="98" width="216" height="152" rx="12" fill="#ffffff" stroke="#cbbef5" stroke-width="1.8"/><rect x="32" y="110" width="192" height="26" rx="6" fill="#f2effb" /><text x="38" y="128" font-size="13" fill="#5b46b2" font-weight="700" >swe-pulse</text><text x="218" y="127" font-size="11" fill="#52606d" font-weight="600" text-anchor="end">核心研发</text><text x="36" y="162" font-size="15" fill="#1e293b" font-weight="700" >多仓库研发编排</text><text x="36" y="194" font-size="12.8" fill="#52606d" font-weight="500" >按任务检出独立 git worktree</text><text x="36" y="216" font-size="12.8" fill="#52606d" font-weight="500" >汇总跨仓 PR/CI 并门禁合入</text><rect x="252" y="98" width="216" height="152" rx="12" fill="#ffffff" stroke="#cbbef5" stroke-width="1.8"/><rect x="264" y="110" width="192" height="26" rx="6" fill="#f2effb" /><text x="270" y="128" font-size="13" fill="#5b46b2" font-weight="700" >morning-brief</text><text x="450" y="127" font-size="11" fill="#52606d" font-weight="600" text-anchor="end">核心日常</text><text x="268" y="162" font-size="15" fill="#1e293b" font-weight="700" >07:30 早间全景简报</text><text x="268" y="194" font-size="12.8" fill="#52606d" font-weight="500" >聚合日历、收件箱与待看 PR</text><text x="268" y="216" font-size="12.8" fill="#52606d" font-weight="500" >集中列出待一键确认的提案</text><rect x="484" y="98" width="216" height="152" rx="12" fill="#ffffff" stroke="#cbbef5" stroke-width="1.8"/><rect x="496" y="110" width="192" height="26" rx="6" fill="#f2effb" /><text x="502" y="128" font-size="13" fill="#5b46b2" font-weight="700" >sleep-consolidate</text><text x="682" y="127" font-size="11" fill="#52606d" font-weight="600" text-anchor="end">核心日常</text><text x="500" y="162" font-size="15" fill="#1e293b" font-weight="700" >23:30 夜间记忆复核</text><text x="500" y="194" font-size="12.8" fill="#52606d" font-weight="500" >核对真实工具日志防记忆幻觉</text><text x="500" y="216" font-size="12.8" fill="#52606d" font-weight="500" >维持启动索引 ≤80 行不膨胀</text><rect x="20" y="266" width="216" height="152" rx="12" fill="#ffffff" stroke="#b5dfd8" stroke-width="1.8"/><rect x="32" y="278" width="192" height="26" rx="6" fill="#eaf6f3" /><text x="38" y="296" font-size="13" fill="#14746a" font-weight="700" >inbox-triage</text><text x="218" y="295" font-size="11" fill="#52606d" font-weight="600" text-anchor="end">消息分拣</text><text x="36" y="330" font-size="15" fill="#1e293b" font-weight="700" >收件箱污点隔离分拣</text><text x="36" y="362" font-size="12.8" fill="#52606d" font-weight="500" >在受限会话读取 local/inbox/</text><text x="36" y="384" font-size="12.8" fill="#52606d" font-weight="500" >提炼结构化摘要写入笔记库</text><rect x="252" y="266" width="216" height="152" rx="12" fill="#ffffff" stroke="#b5dfd8" stroke-width="1.8"/><rect x="264" y="278" width="192" height="26" rx="6" fill="#eaf6f3" /><text x="270" y="296" font-size="13" fill="#14746a" font-weight="700" >gchat</text><text x="450" y="295" font-size="11" fill="#52606d" font-weight="600" text-anchor="end">沟通·可选</text><text x="268" y="330" font-size="15" fill="#1e293b" font-weight="700" >Google Chat 空间助手</text><text x="268" y="362" font-size="12.8" fill="#52606d" font-weight="500" >检索未读群聊与私信上下文</text><text x="268" y="384" font-size="12.8" fill="#52606d" font-weight="500" >生成带全文预览的一键发信提案</text><rect x="484" y="266" width="216" height="152" rx="12" fill="#ffffff" stroke="#f3d39c" stroke-width="1.8"/><rect x="496" y="278" width="192" height="26" rx="6" fill="#fef6e7" /><text x="502" y="296" font-size="13" fill="#9c5700" font-weight="700" >filing-diff</text><text x="682" y="295" font-size="11" fill="#52606d" font-weight="600" text-anchor="end">投研·可选</text><text x="500" y="330" font-size="15" fill="#1e293b" font-weight="700" >连续两期财报语义对比</text><text x="500" y="362" font-size="12.8" fill="#52606d" font-weight="500" >逐节比对 10-K / 10-Q 变动</text><text x="500" y="384" font-size="12.8" fill="#52606d" font-weight="500" >高亮新增风险因素与附注调整</text><rect x="20" y="434" width="216" height="152" rx="12" fill="#ffffff" stroke="#f3d39c" stroke-width="1.8"/><rect x="32" y="446" width="192" height="26" rx="6" fill="#fef6e7" /><text x="38" y="464" font-size="13" fill="#9c5700" font-weight="700" >thesis-check</text><text x="218" y="463" font-size="11" fill="#52606d" font-weight="600" text-anchor="end">投研·可选</text><text x="36" y="498" font-size="15" fill="#1e293b" font-weight="700" >投资逻辑与止损核验</text><text x="36" y="530" font-size="12.8" fill="#52606d" font-weight="500" >对照预设论点评估最新财报</text><text x="36" y="552" font-size="12.8" fill="#52606d" font-weight="500" >触发证伪或止损条件时预警</text><rect x="252" y="434" width="216" height="152" rx="12" fill="#ffffff" stroke="#f3d39c" stroke-width="1.8"/><rect x="264" y="446" width="192" height="26" rx="6" fill="#fef6e7" /><text x="270" y="464" font-size="13" fill="#9c5700" font-weight="700" >ledger-ingest</text><text x="450" y="463" font-size="11" fill="#52606d" font-weight="600" text-anchor="end">账务·可选</text><text x="268" y="498" font-size="15" fill="#1e293b" font-weight="700" >纯文本复式记账导入</text><text x="268" y="530" font-size="12.8" fill="#52606d" font-weight="500" >解析银行 CSV/OFX 对账单</text><text x="268" y="552" font-size="12.8" fill="#52606d" font-weight="500" >写入 local/private/ 并验平</text><rect x="484" y="434" width="216" height="152" rx="12" fill="#ffffff" stroke="#f3d39c" stroke-width="1.8"/><rect x="496" y="446" width="192" height="26" rx="6" fill="#fef6e7" /><text x="502" y="464" font-size="13" fill="#9c5700" font-weight="700" >tax-prep</text><text x="682" y="463" font-size="11" fill="#52606d" font-weight="600" text-anchor="end">账务·可选</text><text x="500" y="498" font-size="15" fill="#1e293b" font-weight="700" >税务底稿与清单追踪</text><text x="500" y="530" font-size="12.8" fill="#52606d" font-weight="500" >提取 W-2 / 1099 表格字段</text><text x="500" y="552" font-size="12.8" fill="#52606d" font-weight="500" >全程隔离在本地私密目录内</text><rect x="20" y="600" width="680" height="56" rx="12" fill="#1e293b" /><text x="360" y="624" font-size="13" fill="#cbd5e1" font-weight="500" text-anchor="middle">所有技能共享同一套底层 Go 安全与回归护栏（无需每项技能重复实现）</text><text x="360" y="644" font-size="12.3" fill="#86efac" font-weight="700" text-anchor="middle">外部读取污点隔离 · ≥8 位哈希一键审批 · 6 项隐私扫描 · 21 项沙箱端到端测试 (~1.8s)</text></g></svg>
