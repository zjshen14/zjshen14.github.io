<svg xmlns="http://www.w3.org/2000/svg" width="760" height="854" viewBox="0 0 760 854" role="img" aria-labelledby="title desc"><title id="title">同一次补课，两份不同的成绩</title><desc id="desc">一次训练：SGD 十类宏平均 64.1% 到 96.1%；JevBench 仍答对 177/231。两项评估的任务与单位不同。单次实测，不代表通用能力。</desc><rect width="760" height="854" fill="#fbfaf7"/><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><text x="36" y="58" font-size="34" fill="#202e3b" font-weight="700" >同一次补课，两份不同的成绩</text><text x="36" y="100" font-size="25" fill="#56636c" font-weight="400" >每张图只比较同一任务的训练前后</text><rect x="24" y="128" width="712" height="304" rx="18" fill="#fff" stroke="#e0e1df"/><text x="48" y="173" font-size="32" fill="#202e3b" font-weight="700" >识别对话行为</text><text x="48" y="211" font-size="25" fill="#56636c" font-weight="400" >例如：询问、确认、拒绝</text><text x="48" y="281" font-size="27" fill="#202e3b" font-weight="400" >补课前</text><rect x="170" y="260" width="392" height="30" rx="4" fill="#f0eef4" /><rect x="170" y="260" width="251.27199999999996" height="30" rx="4" fill="#a9a9b5" /><text x="700" y="285" font-size="32" fill="#202e3b" font-weight="700" text-anchor="end">64.1%</text><text x="48" y="354" font-size="27" fill="#202e3b" font-weight="400" >补课后</text><rect x="170" y="333" width="392" height="30" rx="4" fill="#f0eef4" /><rect x="170" y="333" width="376.7525517241379" height="30" rx="4" fill="#6952bd" /><text x="700" y="358" font-size="32" fill="#6952bd" font-weight="700" text-anchor="end">96.1%</text><text x="170" y="395" font-size="22" fill="#56636c" font-weight="400" >0%</text><text x="562" y="395" font-size="22" fill="#56636c" font-weight="400" text-anchor="end">100%</text><text x="48" y="421" font-size="21" fill="#56636c" font-weight="400" >十个类别等权计分 · SGD 开发集</text><rect x="24" y="460" width="712" height="304" rx="18" fill="#fff" stroke="#e0e1df"/><text x="48" y="505" font-size="32" fill="#202e3b" font-weight="700" >另一套公开题</text><text x="48" y="543" font-size="25" fill="#56636c" font-weight="400" >观察不同任务上的判断表现</text><text x="48" y="613" font-size="27" fill="#202e3b" font-weight="400" >补课前</text><rect x="170" y="592" width="392" height="30" rx="4" fill="#f0eef4" /><rect x="170" y="592" width="300.3636363636364" height="30" rx="4" fill="#a9a9b5" /><text x="700" y="617" font-size="32" fill="#202e3b" font-weight="700" text-anchor="end">177</text><text x="48" y="686" font-size="27" fill="#202e3b" font-weight="400" >补课后</text><rect x="170" y="665" width="392" height="30" rx="4" fill="#f0eef4" /><rect x="170" y="665" width="300.3636363636364" height="30" rx="4" fill="#6952bd" /><text x="700" y="690" font-size="32" fill="#6952bd" font-weight="700" text-anchor="end">177</text><text x="170" y="727" font-size="22" fill="#56636c" font-weight="400" >0</text><text x="562" y="727" font-size="22" fill="#56636c" font-weight="400" text-anchor="end">231 道题</text><text x="48" y="753" font-size="21" fill="#56636c" font-weight="400" >答对的题数 · 已用于诊断的公开 JevBench</text><text x="36" y="815" font-size="30" fill="#202e3b" font-weight="700" >专项进步了。能用到哪里，还得另测。</text></g></svg>
