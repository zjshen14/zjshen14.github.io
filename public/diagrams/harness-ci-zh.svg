<svg xmlns="http://www.w3.org/2000/svg" width="720" height="576" viewBox="0 0 720 576" role="img" aria-labelledby="title desc"><title id="title">当 Agent 自己修改工作流规则时，如何守住边界？</title><desc id="desc">架构图：单次编译共享复用将 18 个隔离沙箱测试从 10.5 秒缩短至 1.8 秒（耗时减少 82.9%，快了约 5.8 倍），使每次推送前都能自动运行 5 项隐私检查、18 次钩子越界模拟和 18 个完整沙箱工作流测试。</desc><defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#14746a"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#5b46b2"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#9c5700"/>
    </marker>
    <marker id="arr-coral" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#b84a39"/>
    </marker>
  </defs><rect width="720" height="576" fill="#fbfaf7" rx="16"/><g font-family="Noto Sans CJK SC, Noto Sans, system-ui, -apple-system, sans-serif"><text x="32" y="48" font-size="24" fill="#1e293b" font-weight="700" >当 Agent 自己修改工作流规则时，如何守住边界？</text><text x="32" y="80" font-size="17" fill="#52606d" font-weight="400" >编译一次 Go 小助手并复用到 18 个测试沙箱，让每次推送前都能自动跑完全套体检</text><rect x="20" y="102" width="680" height="250" rx="16" fill="#ffffff" stroke="#d5dce2" stroke-width="2"/><text x="42" y="138" font-size="19" fill="#1e293b" font-weight="700" >18 条沙箱工作流测试耗时对比</text><text x="42" y="164" font-size="15.5" fill="#52606d" font-weight="400" >消除每个测试沙箱重复编译 Go 小助手的等待时间</text><text x="42" y="217" font-size="17" fill="#1e293b" font-weight="600" >每个测试各自编译</text><rect x="248" y="194" width="280" height="32" rx="6" fill="#f0eef4" /><rect x="248" y="194" width="245" height="32" rx="6" fill="#94a3b8" /><text x="678" y="217" font-size="20" fill="#1e293b" font-weight="700" text-anchor="end">10.5s</text><text x="42" y="281" font-size="17" fill="#1e293b" font-weight="600" >单次编译共享复用</text><rect x="248" y="258" width="280" height="32" rx="6" fill="#f0eef4" /><rect x="248" y="258" width="42" height="32" rx="6" fill="#5b46b2" /><text x="678" y="281" font-size="20" fill="#5b46b2" font-weight="700" text-anchor="end">1.8s (~5.8×)</text><text x="42" y="328" font-size="16.5" fill="#14746a" font-weight="700" >耗时减少 82.9%，使完整沙箱自检能直接挂进每次 git push</text><rect x="20" y="372" width="680" height="184" rx="16" fill="#ffffff" stroke="#d5dce2" stroke-width="2"/><text x="42" y="408" font-size="19" fill="#1e293b" font-weight="700" >每次推送前自动运行的 3 道门禁（合计约 2.5 秒）</text><rect x="42" y="432" width="188" height="98" rx="10" fill="#eaf6f3" stroke="#b5dfd8" stroke-width="1.5"/><text x="136" y="464" font-size="15.5" fill="#14746a" font-weight="700" text-anchor="middle">1. 隐私与路径检查</text><text x="136" y="492" font-size="15" fill="#1e293b" font-weight="600" text-anchor="middle">5 项扫描规则</text><text x="136" y="514" font-size="12.5" fill="#52606d" font-weight="500" text-anchor="middle">防止私密笔记或密钥混入</text><line x1="230" y1="481" x2="258" y2="481" stroke="#14746a" stroke-width="2.2" marker-end="url(#arr-teal)"/><rect x="264" y="432" width="192" height="98" rx="10" fill="#f2effb" stroke="#cbbef5" stroke-width="1.5"/><text x="360" y="464" font-size="15.5" fill="#5b46b2" font-weight="700" text-anchor="middle">2. 钩子越界模拟</text><text x="360" y="492" font-size="15" fill="#1e293b" font-weight="600" text-anchor="middle">18 次越界调用测试</text><text x="360" y="514" font-size="12.5" fill="#52606d" font-weight="500" text-anchor="middle">验证主台防卡死与外发拦截</text><line x1="456" y1="481" x2="484" y2="481" stroke="#5b46b2" stroke-width="2.2" marker-end="url(#arr-purple)"/><rect x="490" y="432" width="188" height="98" rx="10" fill="#fef6e7" stroke="#f3d39c" stroke-width="1.5"/><text x="584" y="464" font-size="15.5" fill="#9c5700" font-weight="700" text-anchor="middle">3. 完整工作流回归</text><text x="584" y="492" font-size="15" fill="#1e293b" font-weight="600" text-anchor="middle">18 个隔离沙箱 (1.8s)</text><text x="584" y="514" font-size="12.5" fill="#52606d" font-weight="500" text-anchor="middle">全部通过才允许推送</text></g></svg>
