  </defs><rect width="1200" height="630" fill="#f4f0e8" rx="16"/><g font-family="Noto Sans CJK SC, Noto Sans, system-ui, -apple-system, sans-serif"><text x="64" y="78" font-size="24" fill="#52606d" font-weight="500" >多任务个人助理 Agent 分享 · github.com/zjshen14/agy-hq</text><text x="64" y="154" font-size="51" fill="#1e293b" font-weight="700" >agy-hq：把 Google Antigravity</text><text x="64" y="224" font-size="48" fill="#1e293b" font-weight="700" >用成多任务并行的个人助理 Agent</text><rect x="64" y="278" width="344" height="244" rx="20" fill="#fff" /><rect x="428" y="278" width="344" height="244" rx="20" fill="#fff" /><rect x="792" y="278" width="344" height="244" rx="20" fill="#fff" /><text x="92" y="332" font-size="21" fill="#52606d" font-weight="600" >真正像助理一样秒回</text><text x="92" y="414" font-size="40" fill="#5b46b2" font-weight="700" >9 项模块化技能</text><text x="92" y="476" font-size="15.5" fill="#52606d" font-weight="400" >代码、日程、收件箱与笔记多线并行</text><text x="456" y="332" font-size="21" fill="#52606d" font-weight="600" >私密隔离与外发门禁</text><text x="456" y="414" font-size="36" fill="#14746a" font-weight="700" >local/ + 一键审批</text><text x="456" y="476" font-size="16" fill="#52606d" font-weight="400" >私密库隔离、污点沙箱与哈希确认</text><text x="820" y="332" font-size="21" fill="#52606d" font-weight="600" >智能派单与配额透视</text><text x="820" y="414" font-size="40" fill="#9c5700" font-weight="700" >97.9% Cache</text><text x="820" y="476" font-size="16" fill="#52606d" font-weight="400" >轻重分流 (含 Carbon) 与 hq obs 实测</text><text x="64" y="584" font-size="23" fill="#1e293b" font-weight="500" >纯 Go 标准库零外部依赖 · 一行 ./scripts/bootstrap.sh --demo 一分钟体验完整沙箱。</text></g></svg>
