<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">agy-hq：把 Google Antigravity 用成多任务并行的个人助理 Agent</title><desc id="desc">单入口秒回个人助理、9 项可选 Markdown 插件技能、local/ 私密库与一键审批门禁、以及轻重模型分流与缓存透视。</desc><defs>
