<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Why did the improvement not transfer?</title><desc id="desc">SGD dialogue classification macro average: about 64% to 96%. Public JevBench: still 177/231. Two different evaluations of one training run.</desc><rect width="1200" height="630" fill="#f4f0e8"/><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><text x="64" y="78" font-size="27" fill="#56636c" font-weight="500" >AI training notes from a home GPU</text><text x="64" y="156" font-size="64" fill="#202e3b" font-weight="700" >My AI scored 96%.</text><text x="64" y="234" font-size="64" fill="#202e3b" font-weight="700" >Now what?</text><rect x="64" y="286" width="514" height="244" rx="20" fill="#fff" /><rect x="602" y="286" width="534" height="244" rx="20" fill="#fff" /><text x="92" y="339" font-size="29" fill="#56636c" font-weight="500" >Dialogue classification</text><text x="92" y="430" font-size="66" fill="#6952bd" font-weight="700" >64% → 96%</text><text x="92" y="492" font-size="24" fill="#56636c" font-weight="400" >Ten-class macro average · rounded</text><text x="630" y="339" font-size="29" fill="#56636c" font-weight="500" >A separate public question set</text><text x="630" y="430" font-size="66" fill="#197b70" font-weight="700" >177 → 177</text><text x="630" y="492" font-size="24" fill="#56636c" font-weight="400" >Correct answers / 231 questions</text><text x="64" y="588" font-size="28" fill="#202e3b" font-weight="500" >One measured run. Different tasks. Real progress has limits.</text></g></svg>
