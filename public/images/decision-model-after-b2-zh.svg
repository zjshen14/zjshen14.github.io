<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">专项进步，为什么没有迁移？</title><desc id="desc">SGD 对话分类宏平均约64%到96%；公开JevBench仍为177/231。单次训练的两项不同评估。</desc><rect width="1200" height="630" fill="#f4f0e8"/><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><text x="64" y="78" font-size="27" fill="#56636c" font-weight="500" >一张家用显卡上的 AI 补课笔记</text><text x="64" y="156" font-size="58" fill="#202e3b" font-weight="700" >我给 AI 补了课，</text><text x="64" y="234" font-size="58" fill="#202e3b" font-weight="700" >它考了 96%，然后呢？</text><rect x="64" y="286" width="514" height="244" rx="20" fill="#fff" /><rect x="602" y="286" width="534" height="244" rx="20" fill="#fff" /><text x="92" y="339" font-size="29" fill="#56636c" font-weight="500" >对话行为分类</text><text x="92" y="430" font-size="66" fill="#6952bd" font-weight="700" >64% → 96%</text><text x="92" y="492" font-size="24" fill="#56636c" font-weight="400" >十类等权平均 · 约数</text><text x="630" y="339" font-size="29" fill="#56636c" font-weight="500" >另一套公开题</text><text x="630" y="430" font-size="66" fill="#197b70" font-weight="700" >177 → 177</text><text x="630" y="492" font-size="24" fill="#56636c" font-weight="400" >答对数 / 共 231 题</text><text x="64" y="588" font-size="28" fill="#202e3b" font-weight="500" >一次实测，两种评估。进步是真的，边界也是真的。</text></g></svg>
